      - name: Build APK
        working-directory: SDL/android-project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace \
            -Pandroid.injected.signing.store.file="$PWD/game.keystore" \
            -Pandroid.injected.signing.store.password=mygames123 \
            -Pandroid.injected.signing.key.alias=mygames \
            -Pandroid.injected.signing.key.password=mygames123

      - name: Name the APK
        run: cp SDL/android-project/app/build/outputs/apk/debug/*.apk "$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK_NAME }}

      - name: Publish release (APK for the Steam app)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ${{ env.APP_LABEL }} (сборка ${{ github.run_number }})
          files: ${{ env.APK_NAME }}
